<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head><meta charset="utf-8"><!--HEYAT-APP--><script>
/* quick backup from the home screen (standalone, works after the main script) */
(function(){
  function toast(t){var e=document.getElementById('gtoast');if(!e)return;e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(function(){e.classList.remove('on')},2600)}
  function lastBk(){try{return +localStorage.getItem('bk_last')||0}catch(x){return 0}}
  function open(){
    if(document.getElementById('qbkp'))return;
    var d=document.createElement('div');d.id='qbkp';d.setAttribute('role','dialog');d.setAttribute('aria-modal','true');d.setAttribute('aria-label','پشتیبان سریع');
    d.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:70;display:flex;align-items:center;justify-content:center;padding:20px';
    d.innerHTML='<div style="background:var(--card);color:var(--ink);border-radius:18px;padding:18px;width:100%;max-width:320px;text-align:center"><h3 style="margin:0 0 8px">پشتیبان سریع</h3><p style="margin:0 0 10px;font-size:.9rem">رمز عبور حساب خود را وارد کنید</p><input type="password" id="qbkpw" autocomplete="off" style="width:100%;padding:10px;border-radius:10px;border:1px solid #bbb;box-sizing:border-box"><div style="margin-top:12px;display:flex;gap:8px"><button id="qbkok" style="flex:1;padding:10px;border:0;border-radius:10px;background:var(--p);color:#fff;font-weight:700">ساخت و ذخیره</button><button id="qbkno" style="flex:1;padding:10px;border-radius:10px;border:1px solid var(--p);background:transparent;color:var(--p)">انصراف</button></div></div>';
    document.body.appendChild(d);
    setTimeout(function(){var i=document.getElementById('qbkpw');if(i)i.focus()},50);
    d.onclick=function(e){
      if(e.target===d||e.target.id==='qbkno'){d.remove();return}
      if(e.target.id!=='qbkok')return;
      var pw=document.getElementById('qbkpw').value;
      if(!pw){toast('رمز عبور را وارد کنید');return}
      var before=lastBk();
      d.remove();
      window.openBk();
      document.getElementById('kpw').value=pw;
      document.querySelector('[data-k="out"]').click();
      window.show('home');
      setTimeout(function(){toast(lastBk()>before?'پشتیبان ساخته و ذخیره شد':'پشتیبان ساخته نشد؛ رمز یا ورود به حساب را بررسی کنید')},2500);
    };
  }
  function addButton(){
    var g=document.getElementById('grid');
    if(!g||document.getElementById('qbkb'))return;
    var w=document.createElement('div');w.style.cssText='text-align:center;padding:10px 14px 0';
    w.innerHTML='<button id="qbkb" style="padding:11px 24px;border:0;border-radius:14px;background:var(--p);color:#fff;font-weight:700;font-size:.95rem">پشتیبان سریع</button>';
    g.parentNode.insertBefore(w,g);
  }
  document.addEventListener('click',function(e){var t=e.target.closest&&e.target.closest('#qbkb');if(t)open()});
  var tries=0;var poll=setInterval(function(){addButton();if(document.getElementById('qbkb')||++tries>40)clearInterval(poll)},250);
})();
</script>

<script>
/* backup screen: activity log, full-restore switch, clear-all and delete-selected backup records */
(function(){
  function esc2(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function readLog(){try{return JSON.parse(localStorage.getItem('hdb_bk_log')||'{}')}catch(e){return{}}}
  function writeLog(m){try{localStorage.setItem('hdb_bk_log',JSON.stringify(m))}catch(e){}}
  window.bkLog=function(kind,detail){
    var e={by:window.HU||'ناشناس',at:Date.now(),kind:kind,detail:String(detail||'')};
    var m=readLog();m[e.at+'_'+Math.random().toString(36).slice(2,6)]=e;writeLog(m);
  };
  function clearAll(){
    if(!confirm('همهٔ داده‌های این گوشی (اعضا، مالی، دعوت‌ها، نظرها و…) پاک می‌شوند. حساب‌های کاربری و گزارش کاربران حفظ می‌شوند. ادامه می‌دهید؟'))return;
    var t=prompt('برای تأیید، عبارت «پاک کن» را بنویسید');
    if(t==null||t.trim()!=='پاک کن'){alert('عملیات لغو شد');return}
    var ks=[];for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf('hdb_')===0&&k!=='hdb_auth'&&k!=='hdb_bk_log')ks.push(k)}
    ks.push('hdb__del','hdb__arch');
    ks.forEach(function(k){localStorage.removeItem(k)});
    alert('داده‌ها پاک شد. برنامه دوباره باز می‌شود.');
    location.reload();
  }
  function deleteSelected(){
    var ids=[].map.call(document.querySelectorAll('#bklog input.bkdel:checked'),function(x){return x.getAttribute('data-id')});
    if(!ids.length)return alert('هیچ موردی انتخاب نشده است');
    if(!confirm(ids.length+' مورد از گزارش پشتیبان‌ها حذف شود؟'))return;
    var m=readLog();ids.forEach(function(id){delete m[id]});writeLog(m);render();
  }
  function render(){
    var c=document.getElementById('bksb');if(!c)return;
    ['fullcard','bklog','admincard'].forEach(function(id){var o=document.getElementById(id);if(o)o.remove()});
    var fc=document.createElement('div');fc.id='fullcard';fc.className='card';
    fc.innerHTML='<b>بازیابی کامل</b><p class="hint" style="margin:4px 0">اگر فعال شود، همهٔ داده‌های این گوشی (به جز حساب‌های کاربری) قبل از بازیابی با محتوای فایل پشتیبان جایگزین می‌شوند. کارهایی که بعد از آن پشتیبان ثبت شده‌اند حذف می‌شوند. پیش از این کار یک پشتیبان از وضعیت فعلی بگیرید.</p><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="fullr"> بازیابی کامل (جایگزینی)</label>';
    c.appendChild(fc);
    var log=readLog();
    var list=Object.keys(log).map(function(k){return[k,log[k]]}).sort(function(a,b){return b[1].at-a[1].at}).slice(0,50);
    var d=document.createElement('div');d.id='bklog';d.className='card';
    d.innerHTML='<b>گزارش کاربران</b>'+(list.length?list.map(function(p){
      var x=p[1];
      return'<div class="kv">'+(x.kind==='backup'?'<label style="display:flex;gap:6px;align-items:center"><input type="checkbox" class="bkdel" data-id="'+esc2(p[0])+'"><span>'+esc2(x.by)+' — پشتیبان</span></label>':'<span>'+esc2(x.by)+' — ادغام</span>')+'<small>'+esc2(new Date(x.at).toLocaleString('fa-IR'))+'</small></div>'+(x.detail?'<small class="hint">'+esc2(x.detail)+'</small>':'')
    }).join(''):'<p class="hint">هنوز فعالیتی ثبت نشده است.</p>');
    c.appendChild(d);
    var ac=document.createElement('div');ac.id='admincard';ac.className='card';
    ac.innerHTML='<b>مدیریت داده</b><p class="hint" style="margin:4px 0">حذف موارد انتخاب‌شده فقط گزارش را پاک می‌کند؛ فایل‌های پشتیبان روی گوشی را باید از مدیریت فایل خودتان پاک کنید.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button id="delsel" class="ib" style="flex:1">حذف موارد انتخاب‌شده</button><button id="clearall" class="ib" style="flex:1;background:#a33;color:#fff">پاک کردن همه داده‌ها</button></div>';
    c.appendChild(ac);
    document.getElementById('delsel').onclick=deleteSelected;
    document.getElementById('clearall').onclick=clearAll;
  }
  window.addEventListener('load',function(){
    var ob=window.openBk;
    if(typeof ob==='function')window.openBk=function(){ob();render()};
  });
})();
</script>

<script>var APP_VER=36;try{var _s=localStorage.getItem("app_html"),_v=+localStorage.getItem("app_ver")||0;if(_s&&_v>APP_VER){document.open();document.write(_s);document.close()}}catch(e){}</script>
<script>window.jleap=function(y){return [1,5,9,13,17,22,26,30].indexOf(((+y%33)+33)%33)>-1};window.jml=function(y,m){m=+m;return m<=6?31:m<=11?30:(window.jleap(y)?30:29)};try{document.documentElement.setAttribute('data-ui',localStorage.getItem('ui_k')||'circle')}catch(e){}</script>
<script>
/* موتور واحد محاسبهٔ مالی: هم صفحهٔ مالی و هم داشبورد از همین استفاده می‌کنند */
window.HFC=function(d,o){o=o||{};var who=o.who||function(){return''},
A=function(v){v=+v;return isFinite(v)?v:0},
fa=function(x){return String(x).replace(/\d/g,function(c){return'۰۱۲۳۴۵۶۷۸۹'[c]})},
sum=function(a,f){return a.reduce(function(t,x){return t+f(x)},0)},
r={led:[],bad:0,orph:0,orphAmt:0},L=r.led,
nmf=function(P,id){var p=(d[P+'_people']||[]).filter(function(x){return x.id===id})[0];return p?p.name:'—'};
function chk(v){var n=+v;if(!isFinite(n)||n<=0)r.bad++}
r.ci=r.co=0;
(d.cash||[]).forEach(function(x){var a=A(x.amount);chk(x.amount);if(x.type==='in')r.ci+=a;else r.co+=a;L.push({d:x.date,s:'ثبت دستی',t:x.title,a:x.type==='in'?a:-a,tab:'cash',id:x.id,w:who(x)})});
['ac','kh'].forEach(function(P){var s=P==='ac'?'آکادمی':'خدام',ids={};(d[P+'_people']||[]).forEach(function(p){ids[p.id]=1});r[P+'p']=0;r[P+'f']=0;
(d[P+'_tx']||[]).forEach(function(x){var a=A(x.amount);chk(x.amount);if(!ids[x.pid]){r.orph++;r.orphAmt+=a}
if(x.kind==='pay'){r[P+'p']+=a;L.push({d:x.date,s:s,t:'پرداخت — '+nmf(P,x.pid),a:a,tab:P,w:who(x)})}
else{r[P+'f']+=a;L.push({d:x.date,s:s,t:'شهریه/بدهی — '+nmf(P,x.pid),a:0,f:a,tab:P,w:who(x)})}})});
var g={};r.st=0;(d.st||[]).forEach(function(x){var v=Math.round(A(x.qty)*A(x.price));if(!(A(x.qty)>0)||!(A(x.price)>0))r.bad++;r.st+=v;var k=x.station+'|'+x.time;(g[k]=g[k]||{station:x.station,time:x.time,tot:0}).tot+=v});
Object.keys(g).forEach(function(k){if(g[k].tot>0)L.push({d:g[k].time,s:'ایستگاه صلواتی',t:'ایستگاه: '+g[k].station,a:-g[k].tot,tab:'st',w:''})});
r.hp=r.pp=r.hu=r.pu=r.dci=r.dco=0;
(d.debts||[]).forEach(function(x){var a=A(x.amount),hey=x.dir==='hey';chk(x.amount);
if(x.cash==='1'){if(hey){r.dci+=a;L.push({d:x.date,s:'بدهی هیئت',t:x.title+' — '+x.person+' (دریافت وجه هنگام ثبت)',a:a,tab:'db',w:who(x)})}else{r.dco+=a;L.push({d:x.date,s:'بدهی اشخاص',t:x.title+' — '+x.person+' (پرداخت وجه به شخص)',a:-a,tab:'db',w:who(x)})}}
if(x.paid==='1'){if(hey)r.hp+=a;else r.pp+=a;L.push({d:x.pdate||x.date,s:hey?'بدهی هیئت':'بدهی اشخاص',t:x.title+' — '+x.person+(hey?' (پرداخت هیئت)':' (دریافت)'),a:hey?-a:a,tab:'db',w:who(x)})}
else if(hey)r.hu+=a;else r.pu+=a});
r.lp=0;r.lr=0;
(d.loans||[]).forEach(function(l){var p=l.pays||{};
if(l.rcv==='1'&&A(l.principal)>0){r.lr+=A(l.principal);L.push({d:l.rdate||l.start,s:'وام (دریافت اصل)',t:l.title,a:A(l.principal),tab:'ln',w:who(l)})}
Object.keys(p).forEach(function(k){var a=A(p[k].a);chk(p[k].a);r.lp+=a;L.push({d:p[k].d,s:'وام و اقساط',t:l.title+' — قسط '+fa(k),a:-a,tab:'ln',w:who({_by:p[k].by})})})});
r.inn=r.ci+r.acp+r.khp+r.pp+r.dci+r.lr;r.out=r.co+r.hp+r.lp+r.st+r.dco;r.bal=r.inn-r.out;
L.sort(function(a,b){var x=a.d||'',y=b.d||'';return y<x?-1:y>x?1:0});return r};
</script>

:root{--bg:#f4efe6;--bg2:#e6efe9;--ink:#1f3a37;--mute:#5d7673;--card:#ffffff;--p:#1f6f68;--p2:#2f9a8f;--gold:#c9a24a;--shadow:rgba(31,58,55,.18);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1f1e;--bg2:#14302c;--ink:#eaf1ee;--mute:#9db5b0;--card:#1a3431;--p:#3aa89b;--p2:#5cc7ba;--gold:#e0bb62;--shadow:rgba(0,0,0,.5)}}
:root[data-theme="dark"]{--bg:#0f1f1e;--bg2:#14302c;--ink:#eaf1ee;--mute:#9db5b0;--card:#1a3431;--p:#3aa89b;--p2:#5cc7ba;--gold:#e0bb62;--shadow:rgba(0,0,0,.5)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
button,input,select,textarea{font-family:inherit}
body{font-family:OnvanFD,Vazirmatn,Tahoma,"Segoe UI",sans-serif;background:linear-gradient(160deg,var(--bg),var(--bg2));color:var(--ink);overflow-x:hidden}
.screen{position:fixed;inset:0;padding:inherit;display:none;flex-direction:column;align-items:center}
.screen.on{display:flex}
/* splash */
#splash{justify-content:center;background:linear-gradient(160deg,var(--bg2),var(--bg));z-index:10;cursor:pointer;transition:opacity .8s}
#splash.out{opacity:0;pointer-events:none}
#splash svg{width:min(62vw,260px);height:auto}
.ln{fill:none;stroke:var(--gold);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2.2s ease forwards}
.ln.b{stroke:var(--p2);animation-delay:.5s}
.ln.c{stroke:var(--p);animation-delay:1s;stroke-width:3}
.fill{fill:var(--p);opacity:0;animation:fade 1s 1.8s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{to{opacity:.9}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
#splash h1{margin:18px 0 4px;font-weight:800;opacity:0;animation:rise .6s forwards}
#splash p{margin:0;opacity:0;animation:rise .6s forwards}
.spin{transform-origin:100px 100px;animation:rot 40s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
/* home */
header.top{width:100%;padding:28px 22px 8px;text-align:center}
header.top h2{margin:0;font-size:1.5rem;font-weight:800}
header.top span{color:var(--mute);font-size:.9rem}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:26px 12px;width:100%;max-width:440px;padding:26px 22px;margin:auto 0;justify-items:center}
.app{display:flex;flex-direction:column;align-items:center;gap:10px;background:none;border:0;font:inherit;color:var(--ink);cursor:pointer;opacity:0;animation:rise .6s forwards}
.app:nth-child(5){grid-column:1/-1}
.circle{width:104px;height:104px;border-radius:50%;background:var(--card);display:grid;place-items:center;box-shadow:0 10px 24px var(--shadow);border:2px solid color-mix(in srgb,var(--gold) 55%,transparent);transition:transform .2s}
.app:active .circle{transform:scale(.92)}
.circle svg{width:52px;height:52px;fill:none;stroke:var(--p);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.circle svg .a{stroke:var(--gold)}
.app b{font-size:.95rem;font-weight:600;text-align:center;max-width:140px;line-height:1.5}
/* section */
#section{justify-content:flex-start}
.bar{width:100%;display:flex;align-items:center;gap:12px;padding:18px 18px 8px}
.back{width:42px;height:42px;border-radius:50%;border:0;background:var(--card);color:var(--ink);box-shadow:0 4px 12px var(--shadow);font-size:1.3rem;cursor:pointer}
.bar h2{margin:0;font-size:1.25rem}
.ph{margin:auto;text-align:center;padding:24px}
.ph .circle{margin:0 auto 18px;width:128px;height:128px}
.ph .circle svg{width:64px;height:64px}
.ph p{color:var(--mute);margin:6px 0}
#splash{background:radial-gradient(circle at 50% 38%,#1f6a62,#0b2422 75%)}
#splash .logo{width:min(74vw,320px);height:auto;opacity:0;transform:scale(.8);animation:pop .7s 0s cubic-bezier(.2,.8,.2,1) forwards,glow 3s .8s ease-in-out infinite;filter:drop-shadow(0 0 18px rgba(224,187,98,.35))}
@keyframes pop{to{opacity:1;transform:none}}
@keyframes glow{50%{filter:drop-shadow(0 0 30px rgba(240,210,120,.7))}}
#splash h1{font-size:1.25rem;color:#f1dfa6;text-align:center;padding:0 24px;line-height:1.7;animation-delay:.5s}
#splash p{color:#a9c7c1;animation-delay:.7s}
.badge{width:84px;height:84px;border-radius:50%;margin:0 auto 10px;display:block;background:radial-gradient(circle,#1f6a62,#0b2422);box-shadow:0 8px 20px var(--shadow);padding:4px}
header.top h2{font-size:1.1rem;line-height:1.7}
#att{justify-content:flex-start}
.tabs{display:flex;gap:6px;width:100%;max-width:520px;padding:4px 16px 8px;overflow-x:auto}
.tabs button,.seg button,.sub button{flex:1;white-space:nowrap;border:0;border-radius:12px;padding:10px 8px;font:inherit;font-size:.88rem;background:var(--card);color:var(--mute);cursor:pointer}
.tabs button.on,.seg button.on,.sub button.on{background:var(--p);color:#fff;font-weight:600}
.seg,.sub{display:flex;gap:6px;margin:6px 0 10px;background:color-mix(in srgb,var(--p) 12%,transparent);padding:4px;border-radius:14px}
.seg button,.sub button{background:none}
#abody{flex:1;min-height:0;overflow:auto;width:100%;max-width:520px;padding:4px 16px 28px}
.card{background:var(--card);border-radius:18px;padding:14px;margin-bottom:14px;box-shadow:0 6px 16px var(--shadow)}
.card h3{margin:0 0 10px;font-size:1rem}
.in,#abody textarea,#abody select{width:100%;font:inherit;font-size:.95rem;color:var(--ink);background:var(--bg);border:1.5px solid color-mix(in srgb,var(--p) 25%,transparent);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.pri,.sec{width:100%;border:0;border-radius:12px;padding:11px;font:inherit;font-weight:600;background:var(--p);color:#fff;cursor:pointer}
.sec{background:var(--gold);color:#1b2b29}
.hint{color:var(--mute);font-size:.85rem;margin:4px 0 8px}
.warn{background:#c4533f22;color:var(--ink);padding:10px;border-radius:12px;font-size:.88rem}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.row small,.row a{display:block;color:var(--mute);font-size:.82rem;text-decoration:none;margin-top:2px}
.acts{display:flex;flex-direction:column;gap:6px}
.acts button,.dp button{border:0;border-radius:10px;padding:6px 10px;font:inherit;font-size:.8rem;background:color-mix(in srgb,var(--p) 15%,transparent);color:var(--ink);cursor:pointer}
.acts .dg{background:#c4533f33}
.dp{display:flex;gap:5px;align-items:center;margin-bottom:8px}
.dp select{margin:0;padding:8px 4px;flex:1}
.stb{display:flex;gap:5px}
.st{border:0;border-radius:10px;padding:8px 9px;font:inherit;font-size:.8rem;background:color-mix(in srgb,var(--mute) 18%,transparent);color:var(--ink);cursor:pointer}
.st.p.on,.chip.p{background:#2f9a5a;color:#fff}.st.l.on,.chip.l{background:#d99a2b;color:#fff}.st.a.on,.chip.a{background:#c4533f;color:#fff}
.chip{display:inline-block;border-radius:9px;padding:3px 8px;font-size:.78rem;margin-inline-start:4px;background:color-mix(in srgb,var(--mute) 25%,transparent)}
#toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:20px;opacity:0;transition:opacity .3s;pointer-events:none;font-size:.9rem}
#toast.on{opacity:1}
.row .acts a.cb{display:block;text-align:center;margin:0;padding:6px 14px;border-radius:10px;background:color-mix(in srgb,var(--p) 15%,transparent);color:var(--ink);font-size:.8rem}
#fin{justify-content:flex-start}
#ftabs button{flex:0 0 auto}
#fbody{flex:1;min-height:0;overflow:auto;width:100%;max-width:520px;padding:4px 16px 28px}
#fbody .lb,#sheet label{display:block;font-size:.82rem;color:var(--mute);margin:4px 2px}

.ia{display:flex;gap:5px;flex-wrap:wrap}

/* ===== Desktop layout (>=1000px). Phone/tablet layouts above are untouched. ===== */
@media (min-width:1000px){

/* home: side panel + big tile area */
#home.on{display:grid;grid-template-columns:minmax(300px,360px) 1fr;grid-auto-rows:min-content;align-content:start;justify-items:stretch;align-items:start;column-gap:8px;padding-inline:max(24px,3vw)}

#home>div:has(#qbkb){grid-column:1;grid-row:2;width:auto!important;padding:16px 0 0!important}

#home .app{padding:8px 4px;border-radius:22px;transition:transform .18s,background .18s;cursor:pointer}
#home .circle{width:116px!important;height:116px!important}

.bar{max-width:920px;padding:30px 28px 10px}

.card{padding:20px 22px}

.ph{max-width:560px}

div:has(>.row~.row):not(.g2)>:not(.row){grid-column:1/-1}
div:has(>.row~.row):not(.g2)>.row{margin-bottom:0}
/* forms keep a comfortable reading width */
.in,#abody textarea,#abody select{max-width:100%}
#lgs .card{width:min(92vw,440px)!important;padding:30px 28px!important;box-shadow:0 30px 80px -20px var(--shadow)}

/* bottom sheets become centred dialogs */
#sheet,#dsh,#ish,#bk,#thp{align-items:center;background:#0008;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
#sheet .sh,#dsh .sh,#ish .sh,#bk .sh,#thp .sh,html[data-ui] #sheet .sh,html[data-ui] #dsh .sh,html[data-ui] #ish .sh,html[data-ui] #bk .sh,html[data-ui] #thp .sh{max-width:620px;max-height:86vh;border-radius:26px!important;padding-top:20px;box-shadow:0 30px 80px #0007;animation:dlgIn .22s cubic-bezier(.2,.8,.2,1)}

/* tile / glass header bands sit inside the work area */

}

/* mouse users: hover feedback (never on touch screens) */

.back:hover{transform:translateX(3px)}
button,.app,.st,.ib,.tabs button,.back,.acts .cb{cursor:pointer}
}
@media (min-width:1700px){html{font-size:18px}#home #grid{max-width:1200px!important}.bar,.tabs{max-width:1040px}#abody,#fbody,#sbody,#dbody,#ibody,.bd{max-width:1040px}}
</style>

function rid(){return Math.random().toString(36).slice(2,10)+Date.now().toString(36)}
var DB={collection:function(c){return{
add:function(d){try{var m=load(c),id=rid();m[id]=Object.assign({},d,{_u:Date.now(),_by:window.HU||''});save(c,m);return Promise.resolve({id:id})}catch(e){return Promise.reject(e)}},
doc:function(id){return{
get:function(){var m=load(c);return Promise.resolve(m[id]?sd(id,m[id]):{exists:false,data:function(){}})},
set:function(d){try{var m=load(c),o=m[id],u=window.HU||'';m[id]=Object.assign({},d,{_u:Date.now(),_by:(o&&o._by)||u});if(o&&u&&u!==m[id]._by)m[id]._ub=u;save(c,m);return Promise.resolve()}catch(e){return Promise.reject(e)}},
update:function(d){try{var m=load(c);if(!m[id])return Promise.reject(new Error('missing'));var u2=window.HU||'';m[id]=Object.assign({},m[id],d,{_u:Date.now()});if(u2&&u2!==m[id]._by)m[id]._ub=u2;else delete m[id]._ub;save(c,m);return Promise.resolve()}catch(e){return Promise.reject(e)}},
delete:function(){try{var m=load(c);delete m[id];tomb(c,id);save(c,m);return Promise.resolve()}catch(e){return Promise.reject(e)}}}},
onSnapshot:function(f){(L[c]=L[c]||[]).push(f);setTimeout(function(){f(qs(c))},0);return function(){}}}}};
window.WHO=function(x){if(!x||!(x._by||x._ub))return'';var t=x._by?'ثبت: '+x._by:'';if(x._ub&&x._ub!==x._by)t+=(t?' · ':'')+'ویرایش: '+x._ub;return'<small class="by">'+String(t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})+'</small>'};
window.claude={use:function(){return Promise.resolve(DB)}};
})();
</script>

 S0.innerHTML='<span class="chip p">حضور '+fa(c.p)+'</span><span class="chip l">تاخیر '+fa(c.l)+'</span><span class="chip a">غیبت '+fa(c.a)+'</span><span class="chip">ثبت‌نشده '+fa(c.n)+'</span> <button class="sec" style="width:auto;padding:5px 12px" data-ac="allp">همه حاضر</button>';
 L.innerHTML=acPeople().map(function(p){var s=acCur(d,p.id);return'<div class="row"><div><b>'+esc(p.name)+'</b></div><div class="stb">'+['p','l','a'].map(function(k){return'<button class="st '+k+(s===k?' on':'')+'" data-ac="mark" data-id="'+p.id+'" data-s="'+k+'">'+ACN[k]+'</button>'}).join('')+'</div></div>'}).join('')||'<p class="hint">'+((DS.ac_people||[]).length?'موردی یافت نشد.':'ابتدا افراد آکادمی را در بخش آکادمی ثبت کنید.')+'</p>'}
function acReport(){var n=0,ds={},ids={};(DS.ac_people||[]).forEach(function(p){ids[p.id]=1});(DS.ac_att||[]).forEach(function(x){if(ids[x.pid]&&!ds[x.date]){ds[x.date]=1;n++}});

 mem:{t:'فهرست اعضا',h:['ردیف','نام و نام خانوادگی','شماره تماس','شماره خانواده','آدرس','تاریخ تولد','نام پدر','معرف'],

 inv:{t:'مداحان و سخنرانان',h:['نام','نقش','تاریخ','مناسبت','میانگین نظر','تعداد نظر'],

 disc:{t:'موارد انضباطی',h:['عضو','نوع','تاریخ','شرح'],

 prz:{t:'جوایز',h:['عضو','عنوان','تاریخ','توضیح'],
  r:function(){return(DS.prz||[]).slice().sort(function(a,b){return(b.date||'')<(a.date||'')?-1:1}).map(function(x){return[rpName(x.mid),x.title,x.date?fd(x.date):'',x.text]})}}
};

 var tb=R.rows.map(function(r){return'<tr>'+r.map(function(c){return'<td style="border:1px solid #444;padding:4px">'+esc(c==null?'':String(c))+'</td>'}).join('')+'</tr>'}).join('');
 return'<div dir="rtl"><h3 style="text-align:center;margin:4px 0">گزارش '+esc(R.t)+'</h3><p style="text-align:center;margin:4px 0">هیئت معظم ابناءالحسن (علیهم السلام) — تاریخ: '+fd(tk())+' — تعداد: '+fa(R.rows.length)+'</p><table style="border-collapse:collapse;width:100%;font-size:12px"><thead>'+th+'</thead><tbody>'+tb+'</tbody></table></div>'}

 T.innerHTML=[['mem','اعضا'],['acad','آکادمی'],['inv','مداحان و سخنرانان'],['disc','انضباطی'],['prz','جوایز']].map(function(x){return'<button class="'+(RP.k===x[0]?'on':'')+'" data-r="k" data-k="'+x[0]+'">'+x[1]+'</button>'}).join('');
 B.innerHTML='<style>@media print{body *{visibility:hidden}#rptout,#rptout *{visibility:visible}#rptout{position:absolute;left:0;top:0;width:100%;color:#000;background:#fff}}</style><div class="ia" style="margin-bottom:8px"><button class="ib pr" data-r="x" data-f="print">چاپ</button><button class="ib pr" data-r="x" data-f="xls">اکسل (.xls)</button><button class="ib pr" data-r="x" data-f="doc">ورد (.doc)</button></div><div id="rptout" style="background:#fff;color:#000;padding:8px;overflow-x:auto">'+rpHtml(rpBuild(RP.k))+'</div>'}

 if(f==='print'){$('#rptout').innerHTML=rpHtml(R);window.print();return}
 var xls=f==='xls',html='<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"></head><body>'+rpHtml(R)+'</body></html>';
 rpSave(new Blob(['\ufeff'+html],{type:(xls?'application/vnd.ms-excel':'application/msword')+';charset=utf-8'}),'hayat-'+RP.k+'-'+tk()+(xls?'.xls':'.doc'));gt('فایل ساخته شد')}

<script>
/* ===== ایستگاه صلواتی: بخش اصلی جدید (افزودنی؛ بخش‌های دیگر بدون تغییر) ===== */
(function(){
var $=function(s){return document.querySelector(s)};
var MN=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function fa(s){return String(s).replace(/\d/g,function(d){return '۰۱۲۳۴۵۶۷۸۹'[d]})}
function pad(n){return n<10?'0'+n:''+n}
function today(){var o={};new Intl.DateTimeFormat('en-u-ca-persian-nu-latn',{year:'numeric',month:'numeric',day:'numeric'}).formatToParts(new Date()).forEach(function(x){o[x.type]=x.value});return{y:+o.year,m:+o.month,d:+o.day}}
function tk(){var o=today();return o.y+'-'+pad(o.m)+'-'+pad(o.d)}
function fd(k){return k?fa(String(k).replace(/-/g,'/')):'—'}
function grp(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,',')}
function mn(n){n=Math.round(n||0);return fa((n<0?'-':'')+grp(Math.abs(n)))+' تومان'}
function norm(s){return String(s||'').replace(/ي/g,'ی').replace(/ك/g,'ک').replace(/\u200c/g,' ').replace(/[٠-٩]/g,function(d){return'٠١٢٣٤٥٦٧٨٩'.indexOf(d)}).replace(/[۰-۹]/g,function(d){return'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)}).replace(/\s+/g,' ').trim().toLowerCase()}
function A(v){return parseFloat(String(v==null?'':v).replace(/[٠-٩]/g,function(d){return'٠١٢٣٤٥٦٧٨٩'.indexOf(d)}).replace(/[۰-۹]/g,function(d){return'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)}).replace('٫','.').replace(/[^\d.]/g,''))||0}
function ic(x){return Math.round(A(x.qty)*A(x.price))}
function full(m){return((m.first||'')+' '+(m.last||'')).trim()}
function gt(t){var e=$('#gtoast');if(!e)return;e.textContent=t;e.classList.add('on');clearTimeout(gt.t);gt.t=setTimeout(function(){e.classList.remove('on')},2600)}
function mins(s){if(!s||!s.in||!s.out)return 0;var a=s.in.split(':'),b=s.out.split(':'),x=+a[0]*60+ +a[1],y=+b[0]*60+ +b[1];if(isNaN(x)||isNaN(y))return 0;if(y<x)y+=1440;return y-x}
function dur(m){if(!m)return '—';var h=Math.floor(m/60),r=m%60;return(h?fa(h)+' ساعت':'')+(h&&r?' و ':'')+(r?fa(r)+' دقیقه':'')}
function nowT(){var d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())}

var D={members:[],st:[],st_staff:[],st_disc:[]},db=null,init=0;
var C={tab:'rep',stk:'',rq:'',open:null,txt:0,del:null,dv:'add',edit:null,sg:'p',fm:'',fs:'all',fst:'',sq:'',mq:'',dq:''};

/* ---------- screen ---------- */
var scr=document.createElement('div');scr.id='stn';scr.className='screen top';
scr.innerHTML='<div class="bar"><button class="back back2" aria-label="بازگشت">→</button><h2>ایستگاه صلواتی</h2></div><div class="tabs" id="sttabs"></div><div class="bd" id="stbody"></div>';
document.body.appendChild(scr);
var B=$('#stbody');

/* ---------- data helpers ---------- */
function groups(){var g={};D.st.forEach(function(x){var k=x.station+'|'+x.time;(g[k]=g[k]||{k:k,station:x.station,time:x.time,items:[]}).items.push(x)});
return Object.keys(g).map(function(k){g[k].tot=g[k].items.reduce(function(s,i){return s+ic(i)},0);return g[k]}).sort(function(a,b){return(b.time||'')<(a.time||'')?-1:(b.time||'')>(a.time||'')?1:0})}
function gl(g){return g.station+' — '+fd(g.time)}
function sorted(){return D.members.slice().sort(function(a,b){return full(a).localeCompare(full(b),'fa')})}
function mname(id,fb){var m=D.members.filter(function(x){return x.id===id})[0];return m?full(m):(fb||'—')}
function stOpts(sel,none){var h=none?'<option value="">بدون ایستگاه مشخص</option>':'';return h+groups().map(function(g){return'<option value="'+esc(g.k)+'"'+(g.k===sel?' selected':'')+'>'+esc(gl(g))+'</option>'}).join('')}

function staffOf(k){return D.st_staff.filter(function(x){return x.stk===k})}
function totMins(x){return(x.sessions||[]).reduce(function(s,v){return s+mins(v)},0)}
function dsel(k,v){var t=today(),p=v?v.split('-'):null,o=p?{y:+p[0],m:+p[1],d:+p[2]}:t,i,h='<div class="dp"><select id="'+k+'_d">';
for(i=1;i<=31;i++)h+='<option value="'+i+'"'+(i===o.d?' selected':'')+'>'+fa(i)+'</option>';
h+='</select><select id="'+k+'_m">';MN.forEach(function(n,j){h+='<option value="'+(j+1)+'"'+(j+1===o.m?' selected':'')+'>'+n+'</option>'});
h+='</select><select id="'+k+'_y">';for(i=Math.min(t.y-4,o.y);i<=Math.max(t.y+1,o.y);i++)h+='<option value="'+i+'"'+(i===o.y?' selected':'')+'>'+fa(i)+'</option>';return h+'</select></div>'}
function dget(k){var y=+$('#'+k+'_y').value,m=+$('#'+k+'_m').value,d=+$('#'+k+'_d').value;return y+'-'+pad(m)+'-'+pad(Math.min(d,window.jml?window.jml(y,m):30))}

  $('#sttabs').innerHTML=TABS.map(function(t){return'<button class="'+(C.tab===t[0]?'on':'')+'" data-a="tab" data-t="'+t[0]+'">'+t[1]+'</button>'}).join('');

  else if(C.tab==='disc')dshell();

/* ----- report ----- */
function fRep(){var L=$('#rlist');if(!L)return;var q=norm(C.rq),g=groups().filter(function(x){return!q||norm(x.station).indexOf(q)>-1});
var tot=g.reduce(function(s,x){return s+x.tot},0),sv=0,mm=0;g.forEach(function(x){var s=staffOf(x.k);sv+=s.length;s.forEach(function(y){mm+=totMins(y)})});
var h='<div class="card"><div class="fl"><b>'+fa(g.length)+' ایستگاه</b><span class="chip a">'+mn(tot)+'</span></div><p class="hint" style="margin:6px 0 0">جمع خادمین ثبت‌شده: '+fa(sv)+' نفر — جمع زمان خدمت: '+dur(mm)+'</p><p class="hint" style="margin:4px 0 0">اطلاعات هزینه‌ها از بخش «امور مالی» خوانده می‌شود و در این بخش قابل تغییر نیست.</p><div class="ia" style="margin-top:8px"><button class="ib pr" data-a="txt">گزارش متنی</button></div></div>';
if(C.txt){var t=repText(g);h+='<div class="card"><textarea id="rta" rows="10" readonly style="width:100%;font:inherit;background:var(--bg);color:var(--ink);border:1.5px solid var(--mute);border-radius:12px;padding:10px">'+esc(t)+'</textarea><button class="pri" data-a="cp">کپی</button>'+(navigator.share?'<button class="sec" data-a="shr" style="margin-top:8px">ارسال در پیام‌رسان</button>':'')+'<button class="ib" data-a="cx" style="margin-top:8px;width:100%;padding:10px">بستن</button></div>'}
h+=g.map(function(x){var op=C.open===x.k,s=staffOf(x.k),dc=D.st_disc.filter(function(d){return d.stk===x.k}).length,sm=s.reduce(function(a,y){return a+totMins(y)},0);
return'<div class="card"><div class="fl stc" data-a="op" data-k="'+esc(x.k)+'"><div><b>'+esc(x.station)+'</b><br><small class="hint">'+fd(x.time)+'</small></div><span class="chip a">'+mn(x.tot)+'</span></div><p class="hint" style="margin:6px 0 0">'+fa(x.items.length)+' قلم — '+fa(s.length)+' خادم'+(sm?' ('+dur(sm)+')':'')+(dc?' — '+fa(dc)+' مورد انضباطی':'')+'</p>'+
(op?'<table><tr><th>کالا</th><th>مقدار</th><th>قیمت واحد</th><th>جمع</th></tr>'+x.items.map(function(i){return'<tr><td>'+esc(i.name)+'</td><td>'+fa(A(i.qty))+' '+esc(i.unit||'')+'</td><td>'+fa(grp(Math.round(A(i.price))))+'</td><td>'+fa(grp(ic(i)))+'</td></tr>'}).join('')+'<tr><th colspan="3">جمع این ایستگاه</th><th>'+fa(grp(x.tot))+'</th></tr></table>'+(s.length?'<p style="margin:10px 0 2px"><b>خادمین:</b></p>'+s.map(function(y){return'<div class="fl" style="padding:3px 0"><span>'+esc(mname(y.mid,y.mname))+'</span><small class="hint">'+dur(totMins(y))+'</small></div>'}).join(''):''):'')+'</div>'}).join('')||'<p class="hint">ایستگاهی یافت نشد. ایستگاه‌ها را در «امور مالی ← ایستگاه صلواتی» ثبت کنید.</p>';
L.innerHTML=h}
function repText(g){var t='گزارش ایستگاه‌های صلواتی — هیئت معظم ابناءالحسن (علیهم السلام)\nتاریخ گزارش: '+fd(tk())+'\n';var tot=0;
g.forEach(function(x){tot+=x.tot;var s=staffOf(x.k);t+='\n● '+x.station+' ('+fd(x.time)+')\nهزینه: '+mn(x.tot)+' — اقلام: '+fa(x.items.length)+'\n';x.items.forEach(function(i){t+='   - '+i.name+': '+fa(A(i.qty))+' '+(i.unit||'')+' × '+fa(grp(Math.round(A(i.price))))+' = '+fa(grp(ic(i)))+'\n'});
if(s.length){t+='خادمین ('+fa(s.length)+' نفر):\n';s.forEach(function(y){t+='   - '+mname(y.mid,y.mname)+' — '+dur(totMins(y))+'\n'})}});
return t+'\nجمع کل هزینه‌ها: '+mn(tot)}

/* ----- staff ----- */
function fStaff(){var R=$('#sres'),L=$('#slist');if(!R||!L)return;
if(!groups().length){R.innerHTML='';L.innerHTML='<p class="hint">ابتدا باید در بخش «امور مالی» یک ایستگاه صلواتی ثبت شود.</p>';return}
var inn={};staffOf(C.stk).forEach(function(x){inn[x.mid]=1});var q=norm(C.sq);
var r=sorted().filter(function(m){return!inn[m.id]&&(!q||norm(full(m)).indexOf(q)>-1||norm(m.phone).indexOf(q)>-1)}).slice(0,40);
R.innerHTML=r.map(function(m){return'<div class="fl" style="padding:6px 0;border-bottom:1px solid var(--bg)"><span>'+esc(full(m))+(m.phone?' <small class="hint">'+esc(m.phone)+'</small>':'')+'</span><button class="ib pr" data-a="addm" data-id="'+m.id+'">افزودن</button></div>'}).join('')||'<p class="hint">عضوی یافت نشد. می‌توانید از تب «عضو جدید» عضو تازه ثبت کنید.</p>';
var s=staffOf(C.stk).sort(function(a,b){return mname(a.mid,a.mname).localeCompare(mname(b.mid,b.mname),'fa')});
L.innerHTML='<h3 style="margin:12px 2px 6px">خادمین ثبت‌شده ('+fa(s.length)+' نفر)</h3>'+(s.map(function(x){var ss=x.sessions||[];
return'<div class="card"><div class="fl"><b>'+esc(mname(x.mid,x.mname))+'</b><span class="chip p">'+dur(totMins(x))+'</span></div>'+
ss.map(function(v,i){return'<div class="tm"><small>ورود</small><input class="in" type="time" data-a="tm" data-f="in" data-id="'+x.id+'" data-i="'+i+'" value="'+esc(v.in||'')+'"><button class="ib" data-a="now" data-f="in" data-id="'+x.id+'" data-i="'+i+'">اکنون</button><small>خروج</small><input class="in" type="time" data-a="tm" data-f="out" data-id="'+x.id+'" data-i="'+i+'" value="'+esc(v.out||'')+'"><button class="ib" data-a="now" data-f="out" data-id="'+x.id+'" data-i="'+i+'">اکنون</button>'+(ss.length>1?'<button class="ib dg" data-a="rs" data-id="'+x.id+'" data-i="'+i+'">×</button>':'')+'</div>'}).join('')+
'<div class="ia"><button class="ib pr" data-a="as" data-id="'+x.id+'">+ افزودن زمان ورود و خروج</button><button class="ib dg" data-a="dx" data-id="'+x.id+'">'+(C.del===x.id?'تأیید حذف خادم':'حذف خادم')+'</button></div>'+who(x)+'</div>'}).join('')||'<p class="hint">هنوز خادمی برای این ایستگاه ثبت نشده است.</p>')}
function saveSess(id,fn){var x=D.st_staff.filter(function(y){return y.id===id})[0];if(!x||!db)return gt('اتصال برقرار نیست؛ وارد حساب شوید');var ss=(x.sessions||[]).map(function(v){return{in:v.in||'',out:v.out||''}});fn(ss);
Promise.resolve(db.collection('st_staff').doc(id).update({sessions:ss})).catch(function(){gt('ثبت نشد')})}

/* ----- station disciplinary ----- */
function dshell(){var s=C.dv;
B.innerHTML='<div class="sub">'+[['add','ثبت'],['list','لیست']].map(function(t){return'<button class="'+(s===t[0]?'on':'')+'" data-a="dv" data-v="'+t[0]+'">'+(t[0]==='add'&&C.edit?'ویرایش':t[1])+'</button>'}).join('')+'</div><div id="dwrap"></div>';
if(s==='add'){var e=C.edit&&D.st_disc.filter(function(x){return x.id===C.edit})[0]||{};C.sg=e.sign||C.sg;
$('#dwrap').innerHTML='<div class="card"><h3>'+(C.edit?'ویرایش مورد انضباطی ایستگاه':'ثبت مورد انضباطی ایستگاه صلواتی')+'</h3><label>ایستگاه</label><select id="dst">'+stOpts(e.stk||C.fst||C.stk,1)+'</select><label>جستجوی عضو</label><input class="in" id="dmq" placeholder="نام یا شماره…" value=""><select id="dmem">'+mopts(e.mid,'')+'</select><label>نوع</label><div class="seg" id="dsg"><button data-a="sg" data-v="p" class="'+(C.sg!=='m'?'on':'')+'">+ مثبت</button><button data-a="sg" data-v="m" class="'+(C.sg==='m'?'on':'')+'">− منفی</button></div><label>تاریخ</label>'+dsel('dd',e.date)+'<label>توضیحات کامل</label><textarea id="dtx" rows="5" placeholder="شرح کامل را بنویسید…">'+esc(e.text)+'</textarea><button class="pri" data-a="dsend">'+(C.edit?'ذخیرهٔ ویرایش':'ثبت')+'</button></div>'}
else $('#dwrap').innerHTML='<select id="dfm">'+mopts(C.fm,'همهٔ اعضا')+'</select><select id="dfs2" style="margin-top:6px"><option value="">همهٔ ایستگاه‌ها</option>'+stOpts(C.fst,0)+'</select><div class="sub">'+[['all','همه'],['p','مثبت'],['m','منفی']].map(function(t){return'<button class="'+(C.fs===t[0]?'on':'')+'" data-a="fs" data-v="'+t[0]+'">'+t[1]+'</button>'}).join('')+'</div><div id="dlist"></div>'}
function mopts(sel,all,q){var qq=norm(q||'');return'<option value="">'+(all||'انتخاب عضو…')+'</option>'+sorted().filter(function(m){return m.id===sel||!qq||norm(full(m)).indexOf(qq)>-1||norm(m.phone).indexOf(qq)>-1}).map(function(m){return'<option value="'+m.id+'"'+(m.id===sel?' selected':'')+'>'+esc(full(m))+'</option>'}).join('')}
function fDisc(){var L=$('#dlist');if(!L)return;
var a=D.st_disc.filter(function(x){return(!C.fm||x.mid===C.fm)&&(C.fs==='all'||x.sign===C.fs)&&(!C.fst||x.stk===C.fst)}).sort(function(a,b){return(b.at||0)-(a.at||0)});
var p=a.filter(function(x){return x.sign==='p'}).length;
L.innerHTML='<p class="hint">'+fa(a.length)+' مورد — مثبت: '+fa(p)+' — منفی: '+fa(a.length-p)+'</p>'+(a.map(function(x){var ps=x.sign==='p';return'<div class="card"><div class="fl"><span class="chip '+(ps?'p':'a')+'">'+(ps?'+ مثبت':'− منفی')+'</span><small class="hint">'+fd(x.date)+'</small></div><b>'+esc(mname(x.mid,x.mname))+'</b>'+(x.station?'<br><small class="hint">ایستگاه: '+esc(x.station)+(x.time?' — '+fd(x.time):'')+'</small>':'')+'<p style="white-space:pre-wrap;margin:6px 0">'+esc(x.text)+'</p>'+(who(x)||'<small class="hint">ثبت‌کننده: '+esc(x.by)+'</small>')+'<div class="ia" style="margin-top:8px"><button class="ib" data-a="ded" data-id="'+x.id+'">ویرایش</button><button class="ib dg" data-a="ddl" data-id="'+x.id+'">'+(C.del===x.id?'تأیید حذف':'حذف')+'</button></div></div>'}).join('')||'<p class="hint">موردی ثبت نشده است.</p>')}

/* ----- new members ----- */
function nshell(){B.innerHTML='<div class="card"><h3>ثبت عضو جدید</h3><p class="hint" style="margin:0 0 6px">عضو ثبت‌شده مستقیم به «اعضا» افزوده می‌شود و جزو اعضای هیئت حساب می‌شود.</p><input class="in" id="n1" placeholder="نام"><input class="in" id="n2" placeholder="نام خانوادگی"><input class="in" id="n3" type="tel" placeholder="شماره تماس"><input class="in" id="n4" placeholder="آدرس"><label>معرف (اختیاری)</label><select id="n5">'+mopts('','بدون معرف')+'</select><label>افزودن همزمان به خادمین ایستگاه (اختیاری)</label><select id="n6">'+stOpts('',1)+'</select><button class="pri" data-a="nsave">ثبت عضو</button></div><div id="nlist"></div>'}
function fNew(){var L=$('#nlist');if(!L)return;var a=D.members.filter(function(m){return m.src==='st'}).sort(function(a,b){return(b.at||0)-(a.at||0)});
L.innerHTML='<h3 style="margin:12px 2px 6px">اعضای ثبت‌شده از این بخش ('+fa(a.length)+')</h3>'+(a.map(function(m){return'<div class="card"><b>'+esc(full(m))+'</b>'+(m.phone?'<br><small class="hint">'+esc(m.phone)+'</small>':'')+(m.address?'<br><small class="hint">'+esc(m.address)+'</small>':'')+(m.at?'<br><small class="hint">'+fa(new Date(m.at).toLocaleDateString('fa-IR'))+'</small>':'')+who(m)+'</div>'}).join('')||'<p class="hint">هنوز عضوی از این بخش ثبت نشده است. ویرایش یا حذف اعضا از بخش «اعضا» انجام می‌شود.</p>')}

/* ---------- events ---------- */
function v(id){var e=$('#'+id);return e?e.value.trim():''}
scr.addEventListener('click',function(e){var b=e.target.closest('[data-a]');if(!b)return;var a=b.dataset.a,id=b.dataset.id,i=+b.dataset.i;
if(a==='tab'){C.tab=b.dataset.t;C.del=null;C.edit=null;C.txt=0;view()}
else if(a==='op'){C.open=C.open===b.dataset.k?null:b.dataset.k;fill()}
else if(a==='txt'){C.txt=1;fill()}else if(a==='cx'){C.txt=0;fill()}
else if(a==='cp'){var t=$('#rta');t.select();try{navigator.clipboard.writeText(t.value).then(function(){gt('کپی شد')},function(){document.execCommand('copy');gt('کپی شد')})}catch(x){try{document.execCommand('copy');gt('کپی شد')}catch(y){}}}
else if(a==='shr')navigator.share({text:$('#rta').value}).catch(function(){});
else if(a==='addm'){if(!db||!C.stk)return gt('اتصال برقرار نیست؛ وارد حساب شوید');var g=groups().filter(function(x){return x.k===C.stk})[0];if(!g)return;
 Promise.resolve(db.collection('st_staff').add({stk:g.k,station:g.station,time:g.time,mid:id,mname:mname(id),sessions:[{in:'',out:''}],by:window.HU||'',at:Date.now()})).then(function(){gt('خادم افزوده شد')}).catch(function(){gt('ثبت نشد')})}
else if(a==='as')saveSess(id,function(s){s.push({in:'',out:''})});
else if(a==='rs')saveSess(id,function(s){s.splice(i,1)});
else if(a==='now')saveSess(id,function(s){if(s[i])s[i][b.dataset.f]=nowT()});
else if(a==='dx'){if(C.del===id){C.del=null;db&&db.collection('st_staff').doc(id).delete().catch(function(){gt('حذف نشد')})}else{C.del=id;fill()}}
else if(a==='dv'){C.dv=b.dataset.v;if(C.dv==='list')C.edit=null;view()}
else if(a==='sg'){C.sg=b.dataset.v;[].forEach.call($('#dsg').children,function(x){x.classList.toggle('on',x===b)})}
else if(a==='fs'){C.fs=b.dataset.v;dshell();fill()}
else if(a==='ded'){C.edit=id;C.dv='add';view()}
else if(a==='ddl'){if(C.del===id){C.del=null;db&&db.collection('st_disc').doc(id).delete().catch(function(){gt('حذف نشد')})}else{C.del=id;fill()}}
else if(a==='dsend'){var mid=v('dmem'),tx=v('dtx'),sk=v('dst');if(!mid)return gt('عضو را انتخاب کنید');if(tx.length<3)return gt('توضیحات را بنویسید');if(!db)return gt('اتصال برقرار نیست؛ وارد حساب شوید');
 var g2=groups().filter(function(x){return x.k===sk})[0],o={mid:mid,mname:mname(mid),sign:C.sg,text:tx,date:dget('dd'),stk:g2?g2.k:'',station:g2?g2.station:'',time:g2?g2.time:''},ed=C.edit;C.fst=sk;
 var p=ed?db.collection('st_disc').doc(ed).update(o):db.collection('st_disc').add(Object.assign(o,{by:window.HU||'',at:Date.now()}));
 Promise.resolve(p).then(function(){gt(ed?'ویرایش شد':'ثبت شد');C.edit=null;C.dv=ed?'list':'add';view()}).catch(function(){gt('ثبت نشد؛ سطح دسترسی را بررسی کنید')})}
else if(a==='nsave'){var o2={first:v('n1'),last:v('n2'),phone:v('n3'),address:v('n4'),ref:v('n5')},sk2=v('n6');
 if(!o2.first&&!o2.last)return gt('نام را وارد کنید');if(!db)return gt('اتصال برقرار نیست؛ وارد حساب شوید');
 var nn=norm(full(o2));if(D.members.some(function(m){return norm(full(m))===nn}))return gt('عضوی با همین نام قبلاً ثبت شده است');
 Promise.resolve(db.collection('members').add(Object.assign(o2,{at:Date.now(),src:'st'}))).then(function(r){
  var g3=groups().filter(function(x){return x.k===sk2})[0];
  if(g3&&r&&r.id)return db.collection('st_staff').add({stk:g3.k,station:g3.station,time:g3.time,mid:r.id,mname:full(o2),sessions:[{in:'',out:''}],by:window.HU||'',at:Date.now()})}).then(function(){gt('عضو جدید ثبت شد');nshell();fill()}).catch(function(){gt('ثبت نشد')})}
});
scr.addEventListener('change',function(e){var t=e.target,a=t.dataset&&t.dataset.a;
if(t.id==='stsel'){C.stk=t.value;C.del=null;fill()}
else if(t.id==='dfm'){C.fm=t.value;fill()}
else if(t.id==='dfs2'){C.fst=t.value;fill()}
else if(a==='tm'){var f=t.dataset.f,val=t.value;saveSess(t.dataset.id,function(s){var k=+t.dataset.i;if(s[k])s[k][f]=val})}});
scr.addEventListener('input',function(e){var t=e.target;
if(t.id==='rq'){C.rq=t.value;fRep()}
else if(t.id==='sq'){C.sq=t.value;fStaff()}
else if(t.id==='dmq'){var s=$('#dmem');if(s)s.innerHTML=mopts(s.value,'',t.value)}});

/* ---------- connect + open ---------- */
async function connect(){try{var d=window.claude&&await claude.use('db');if(!d){B.insertAdjacentHTML('afterbegin','<p class="warn">برای مشاهده و ثبت باید با حساب خود وارد شوید.</p>');return}db=d;
['members','st','st_staff','st_disc'].forEach(function(c){d.collection(c).onSnapshot(function(q){D[c]=q.docs.map(function(x){return Object.assign({id:x.id},x.data())});fill()})})}catch(e){}}
window.openSt=function(){window.show('stn');if(!init){init=1;connect()}view()};

/* ---------- home button (appended; existing buttons untouched) ---------- */
function addBtn(){var g=document.getElementById('grid');if(!g||document.getElementById('stnb'))return;var b=document.createElement('button');b.className='app';b.id='stnb';
b.innerHTML='<span class="circle"><svg viewBox="0 0 48 48"><path d="M12 16h24l-2.4 22a4 4 0 0 1-4 3.6H18.4a4 4 0 0 1-4-3.6z"/><path class="a" d="M17 25h14M20 6.5v4M24 5v5.5M28 6.5v4"/></svg></span><b>ایستگاه صلواتی</b>';
b.onclick=function(){window.openSt()};g.appendChild(b)}
addBtn();var tries=0,poll=setInterval(function(){addBtn();if(document.getElementById('stnb')||++tries>40)clearInterval(poll)},250);
})();
</script>
